name: build-windows-installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows installer
        run: pnpm dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pathos-desktop-windows-installer
          path: release/*.exe
