name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      PATHOS_ENV: ci
      PATHOS_BASE_URL: /api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install poetry
          poetry --version    

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Debug Poetry deps
        run: |
          poetry show pydantic-settings
          poetry run python -c "import pydantic_settings; print('pydantic_settings OK')"

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run python scripts/ci/ruff_format_check_changed.py

      - name: Mypy
        run: poetry run mypy .

      - name: Pytest with coverage gate
        run: poetry run pytest

      - name: Migration files sanity
        run: |
          poetry run python - <<'PY'
          from pathlib import Path
          import re
          import sys

          migration_files = sorted(Path("app/db/migrations").glob("*.sql"))
          if not migration_files:
              raise SystemExit(0)

          bad_names = [path.name for path in migration_files if re.fullmatch(r"\d{3}_.+\.sql", path.name) is None]
          if bad_names:
              print("Invalid migration filenames:", ", ".join(bad_names))
              print("Expected format: NNN_description.sql")
              raise SystemExit(1)

          numbers = [int(path.name[:3]) for path in migration_files]
          expected = list(range(numbers[0], numbers[0] + len(numbers)))
          if numbers != expected:
              print(f"Migration numbering is not contiguous: {numbers}")
              print(f"Expected contiguous sequence: {expected}")
              raise SystemExit(1)

          empty_files = [path.name for path in migration_files if not path.read_text(encoding="utf-8").strip()]
          if empty_files:
              print("Empty migration files:", ", ".join(empty_files))
              raise SystemExit(1)
          PY

      - name: Schema versioning discipline
        run: |
          poetry run python scripts/ci/check_schema_migration_discipline.py --base-ref develop

      - name: OpenAPI snapshot is up to date
        run: |
          poetry run python scripts/export_openapi.py
          if ! git diff --exit-code artifacts/contracts/openapi.json; then
            echo "OpenAPI snapshot drift detected."
            echo "Fix with: poetry run python scripts/export_openapi.py"
            exit 1
          fi

  quality-gates-postgres:
    runs-on: ubuntu-latest
    env:
      PATHOS_ENV: ci
      PATHOS_BASE_URL: /api/v1
      DB_DIALECT: postgres
      DATABASE_URL: postgresql://pathos:pathos@localhost:5432/pathos_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pathos
          POSTGRES_PASSWORD: pathos
          POSTGRES_DB: pathos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathos -d pathos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install poetry
          poetry --version

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Run Alembic migrations on Postgres
        run: poetry run alembic upgrade head

      - name: Postgres contract and migration tests
        run: |
          poetry run pytest -q \
            tests/db/repo/test_repository_contracts.py \
            tests/db/repo/test_alert_rule_repo.py \
            tests/db/repo/test_alert_scheduler_lock_repo.py \
            tests/test_alembic_migrations.py \
            --cov=app --cov-fail-under=0
          poetry run pytest -q tests/integrity/test_system_integrity_harness_v1.py --no-cov
