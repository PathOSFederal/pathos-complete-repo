services:
  api:
    build:
      context: .
    env_file:
      - .env
    command:
      - poetry
      - run
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
    env_file:
      - .env
    command:
      - poetry
      - run
      - python
      - -m
      - app.worker
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
